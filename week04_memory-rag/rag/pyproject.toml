[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-search-tool"
version = "0.1.0"
description = "CLI RAG indexing, hybrid retrieval, and grounded DashScope answers"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "dashscope>=1.23.0,<2.0.0",
    "llama-index-core==0.14.25",
    "llama-index-embeddings-dashscope==0.5.0",
    "jieba==0.42.1",
    "rank-bm25==0.2.2",
    "pypdf>=6.19.0,<8.0.0",
    "beautifulsoup4>=4.13.4,<5.0.0",
    "lxml>=5.3.2,<7.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<10.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[project.scripts]
rag = "rag.cli:main"

[tool.setuptools.packages.find]
include = ["rag*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
