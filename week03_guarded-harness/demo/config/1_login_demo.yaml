version: 2
state_dir: ../.guarded-harness/1_login_demo
workspace:
  root: ../workspace/1_login_demo
  require_clean_workspace: true
  protect_other_git_changes: true
budget:
  max_steps: 16
  max_tool_calls: 40
  max_token_cost: 2
  max_wall_time_seconds: 900
model:
  provider: openai_chat_completions_v1
  model_id: deepseek-flash
  endpoint: https://api.deepseek.com
  credential_ref: OPENAI_API_KEY
  tokenizer_id: tiktoken:o200k_base
  request_timeout_seconds: 120
  connect_timeout_seconds: 10
  max_input_tokens: 120000
  max_output_tokens: 32768
  max_response_bytes: 1048576
  max_tool_calls_per_response: 12
  requests_per_minute: 60
  max_retry_attempts: 1
  tool_choice: auto
  pricing:
    version: deepseek-flash-manual-budget-v1
    input_per_million: "1.00"
    output_per_million: "2.00"
task:
  id: demo_login_code_understanding
  kind: code_understanding
  description: Analyze the configured demo repository using the CLI-provided instruction.
  allowed_tools:
    - git_diff
    - git_status
    - list_files
    - read_directory
    - read_file
    - search_code
    - write_file
  paths:
    deny_read:
      - "**/.env"
      - "**/*.pem"
      - "**/*.key"
      - "**/*.p12"
      - "**/*.pfx"
      - "**/credentials"
      - "**/credentials.json"
    deny_write:
      - src/**
      - tests/**
    allow_write:
      - artifacts/login-flow.md
  acceptance:
    strategy: code_understanding
    deliverables:
      - artifacts/login-flow.md
  approval:
    required_tools:
      - write_file
    approver_roles:
      - local_operator
    ttl_seconds: 3600
    channel: local_cli
