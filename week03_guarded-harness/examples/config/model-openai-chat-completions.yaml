version: 2
state_dir: ../.real-model-state/code-understanding
workspace:
  root: ../workspaces/code-understanding
  require_clean_workspace: true
  protect_other_git_changes: true
budget:
  max_steps: 12
  max_tool_calls: 20
  max_token_cost: 1
  max_wall_time_seconds: 600
model:
  provider: openai_chat_completions_v1
  model_id: deepseek-flash
  endpoint: https://api.deepseek.com
  credential_ref: OPENAI_API_KEY
  tokenizer_id: tiktoken:o200k_base
  request_timeout_seconds: 120
  connect_timeout_seconds: 10
  max_input_tokens: 120000
  max_output_tokens: 4096
  max_response_bytes: 1048576
  max_tool_calls_per_response: 8
  requests_per_minute: 60
  max_retry_attempts: 1
  tool_choice: auto
  pricing:
    version: deepseek-flash-manual-budget-v1
    # Trusted governance ceiling for manual acceptance; adjust if provider pricing changes.
    input_per_million: "1.00"
    output_per_million: "2.00"
task:
  id: real_model_code_understanding
  kind: code_understanding
  description: Explain the login status branch without changing source code.
  allowed_tools:
    - read_file
    - write_file
  paths:
    deny_read:
      - "**/.env"
      - "**/*.pem"
      - "**/*.key"
    deny_write:
      - src/**
      - tests/**
    allow_write:
      - artifacts/code-understanding.md
  acceptance:
    strategy: code_understanding
    deliverables:
      - artifacts/code-understanding.md
  approval:
    required_tools:
      - write_file
    approver_roles:
      - local_operator
    ttl_seconds: 900
    channel: local_cli
